# MULTIDEX watch profile - "default"
#
# This file is the entire configuration surface. Every knob justifies
# itself in one line. The shipped values are a complete, sane watch:
# an operator who never edits this file still gets the full system.
# Copy this file under a new name to shape a different watch.

name = "default"

[source]
# Where the spectrum comes from: "real" (an RTL-SDR through rtl_sdr
# and rtl_fm) or "simulated" (deterministic synthetic spectrum, no
# hardware). The shipped default is "real": on a machine with the
# dongle and tools, a first watch is a real watch. If the real source
# cannot be stood at muster - tools missing or the dongle unreachable -
# the watch falls back to the simulated source and states the
# substitution plainly in the muster output, in the status verb, and
# in every product's coverage account. It never substitutes silently.
kind = "real"
# Seed for the simulated world. Same seed, same spectrum.
seed = 20261117

[home]
# Home position. Local only; products describe it at region level only.
# The shipped values are a reference position in the central United
# States. They are reference coordinates only: you must set your own
# position here before a real watch. Satellite passes, radiosonde
# windows and position reporting are all computed from this point, so
# a real watch flown on the reference position reports the wrong sky.
lat = 39.0
lon = -98.0
alt_m = 300
# Region-level words the products may use for the home position.
region = "the central United States"
# Which antenna is on the tuner. Recorded at muster; the coverage
# account is meaningless without it.
antenna = "general coverage antenna"

[watch]
# Watch length in hours. 24 is the standard the system is built around.
hours = 24
# SITREP cadence in hours of watch time.
sitrep_hours = 6
# Deep census sweep window, local hours: quietest bands, best hunting.
deep_sweep_start = 1
deep_sweep_end = 4
# Hard ceiling on everything the watch writes, snippets included.
disk_ceiling_gb = 20

[rotation]
# Class B standing rotation: weight (share of the day) and dwell
# length in seconds for each entry. The Watch Officer re-weights HF
# entries by the hour; propagation is not flat and neither is the bill.
adsb     = { weight = 16, dwell_s = 120 }
airband  = { weight = 20, dwell_s = 120 }
milair   = { weight = 10, dwell_s = 90 }
datalink = { weight = 6,  dwell_s = 300 }
marine   = { weight = 6,  dwell_s = 300 }
aprs     = { weight = 4,  dwell_s = 240 }
ism433   = { weight = 5,  dwell_s = 240 }
ism915   = { weight = 4,  dwell_s = 240 }
pager    = { weight = 4,  dwell_s = 300 }
cellular = { weight = 3,  dwell_s = 240 }
trunking = { weight = 3,  dwell_s = 240 }
fmband   = { weight = 2,  dwell_s = 180 }
hf_day   = { weight = 4,  dwell_s = 300 }
hf_night = { weight = 4,  dwell_s = 300 }
meteor   = { weight = 3,  dwell_s = 300 }

[desks]
# Desks that stand the watch. Desks absent from this list are benched
# for the watch. Benched-with-reason desks (design section 7, Tier 2
# integrations owed) bench themselves regardless; doctor lists them.
stand = ["adsb", "airband", "milair", "acars", "ais", "wxradio", "ism",
         "aprs", "pager", "sweep", "satellite", "sonde", "cellular",
         "trunking", "broadcast", "audiocensus", "amateur", "iss",
         "vdl2", "digitalvoice", "hfdl", "probe", "jupiter", "solar",
         "meteor", "hydrogen"]
# Desks to bench even though they could stand.
bench = []

[probe]
# The probe desk (0.11.0): stares at the unexplained. At muster it
# computes its candidate list from the Index - emitters heard at
# least min_observations times, graded UNRESOLVED, never decoded -
# ranks them by recurrence, classifier uncertainty and SNR, and
# bills one stare per candidate as a class P bill item inside this
# budget. The budget bounds the watch's probe work in count and in
# tuner seconds; unspent budget is simply not used, and a watch
# with no candidates bills no stares.
max_per_watch = 4
max_seconds_per_watch = 2400
# One stare's length: long enough for a recurring emitter to show
# its habit inside the capture, short enough that the rotation is
# not starved.
dwell_s = 600
# A candidate is by definition heard more than once: a single
# hearing is a census row, not a target.
min_observations = 2

[retro]
# Retroactive exploitation (0.12.0): when a decoder's capability
# changes, the improvement is owed to the archive - the decoder
# re-runs over every retained capture its current version has
# not examined, inside this per-watch budget, spent at muster
# and at dwell boundaries so no billed dwell is ever delayed.
# What the budget does not reach stays owed, is stated as owed
# in status and in the Watch Report, and carries to the next
# watch. The reprocess verb runs the same pass unbounded at the
# operator's direct ask, while no watch stands.
max_captures_per_watch = 25
max_seconds_per_watch = 120

[applicability]
# Applicability (0.9.0): at muster the officer judges every desk
# against the home position and stands down the desks whose targets
# provably cannot exist within reach of the home, with the reason
# stated in the muster output, in status and in doctor. A stood-down
# desk is not benched: it cannot run at this home and would stand at
# another. Every test fails toward coverage - a desk stands down
# only when the shipped land and water grid establishes that its
# targets cannot be here.
# Ship AIS is a VHF service. From a ship's antenna tens of metres
# up and a home antenna, the radio horizon is a few tens of
# kilometres in the best conditions; 100 km is a generous outer
# bound that keeps every plausibly reachable waterway in coverage.
# The marine desk stands down only when the nearest water in the
# grid is farther than this.
marine_range_km = 100
# Operator overrides, either way, regardless of the tests. Muster
# states when an override decided a desk's outcome.
force_stand = []
force_stand_down = []

[alerts]
# A two-tone chime sounds on the host when a FLASH is written, so an
# alert is audible in the room as well as filed. The chime never
# blocks a FLASH: with no audio player on the host, the FLASH records
# that it was not played.
chime = true

[flash]
# Lowest confidence grade that can raise a FLASH on an assessment.
threshold_grade = "PROBABLE"
# Emitter keys that always alert when heard. Empty by default.
watch_emitters = []
# Frequencies that always alert when active, in Hz. The 121.5 MHz
# aviation guard is the standing entry.
watch_freqs_hz = [121500000]
guard_hz = 121500000

[snippets]
# I/Q snippets are kept only for unidentified or anomalous emissions,
# ten seconds at a time, capped per watch.
iq_max_per_watch = 100
# Voice transmissions kept whole, per voice desk, per watch.
voice_cap_per_desk = 200
# Satellite imagery is product and is kept whole.
satellite_keep = true

[transcription]
# Voice desks whose audio is transcribed in the background. Bounded:
# transcription never blocks collection and reports its backlog.
desks = ["airband"]
cap_per_watch = 40

[excluded]
# Bands the watch never dwells on, as [low_hz, high_hz] pairs.
bands = []

[sondes]
# Regional upper-air launch sites the sonde desk covers. Balloons rise
# ahead of the synoptic hours and fly for about two hours.
sites = [
  { name = "North site", lat = 40.2, lon = -98.3 },
  { name = "South site", lat = 37.8, lon = -97.6 },
]
synoptic_hours = [0, 12]

[updates]
# Live updates (0.7.0). The system fetches signed releases from its
# own git remote, verifies them against the allowed-signers file in
# the home, stages them as a new generation beside the running one,
# and activates them at a dwell boundary under the keeper - a
# standing watch never ends for an update. This engages only in a
# generation-layout install (see the README's live update section);
# a plain single-tree checkout runs exactly as before.
# Posture gates activation only, never verification: "automatic"
# activates a verified, gate-passed release on its own;
# "notify-only" stages it and waits for `multidex update approve`;
# "off" verifies and stages nothing activates.
posture = "notify-only"
# The git remote in the install's repo clone to fetch releases from.
remote = "origin"
# The expected URL of that remote. Empty pins the URL seen at the
# first successful check into the home's update state; a remote
# that later answers at a different URL is a stop condition.
remote_url = ""
# How often the standing watch checks for a release, in hours.
check_interval_hours = 6
# Ordinary bill items a new generation must complete under
# probation before it is marked successful.
probation_items = 3
# No handover or rollback is flown when the next bill item is a
# satellite pass, or within this many minutes before one.
pass_guard_minutes = 30
# Doctor and status warn when no check of the remote has completed
# inside this many days: a silently frozen channel is a failure.
freeze_warning_days = 14

[advanced]
# Per-desk tuner gain in dB. A setting that serves airband starves HF;
# each desk carries its own. 23 dB is the house finding for the site.
gain_db = { default = 23 }
# Orbital elements file, resolved beside this profile.
tle_file = "tle.txt"
# Interrupts the Watch Officer may take per hour of watch time.
interrupt_cap_per_hour = 3
# Test knob: watch-time seconds per real second. 1.0 is a real watch.
# Higher values run the identical logic paths at speed, for smoke
# runs and rehearsals. Also settable as MULTIDEX_TIME_SCALE.
time_scale = 1.0
# Simulated tuner outages as [start_offset_s, duration_s] pairs, for
# rehearsing failure behavior. Empty in a real watch.
tuner_outages = []
